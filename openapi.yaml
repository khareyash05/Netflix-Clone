openapi: 3.0.0
info:
  title: Netflix Clone API
  version: 1.0.0
  description: API documentation for the Netflix clone backend services.
servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server
  - url: https://api.netflix-clone.com/v1
    description: Production Server
paths:
  /movies:
    get:
      summary: Get a list of all movies
      description: Retrieve a list of all available movies, optionally filtered by genre or search query.
      parameters:
        - in: query
          name